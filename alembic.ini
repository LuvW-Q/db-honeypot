# ============================================================
# Alembic 迁移配置（数据库蜜罐与攻击行为分析系统）
#
# 约定：
# 1. 不在此文件写死数据库 URL，连接串由 migrations/env.py 从仓库根 .env
#    的 MIGRATE_DATABASE_URL 读取，避免口令进入版本库。
# 2. script_location 指向 M1 模块的 migrations；prepend_sys_path = . 使
#    `m1_transaction_integration` 与 `shared` 在仓库根执行 alembic 时可直接导入。
# 3. 迁移产物是表、约束、视图、索引与规则种子的唯一事实来源。
# ============================================================

[alembic]
# 迁移脚本目录（相对仓库根；迁移归 M1 所有）
script_location = modules/m1-transaction-integration/migrations

# 运行 alembic 时将仓库根加入 sys.path，保证模块包可导入
prepend_sys_path = .

# 版本目录默认为 migrations/versions
# version_locations = %(here)s/migrations/versions

# 多路径分隔符使用操作系统分隔符
path_separator = os

# 修订文件名模板：默认 <revision>_<slug>.py，本项目 revision 已带 000N 前缀
# file_template = %%(rev)s_%%(slug)s

# 迁移输出编码
output_encoding = utf-8

# 数据库 URL：留空，由 env.py 从 .env 读取 MIGRATE_DATABASE_URL
# sqlalchemy.url 故意不设置；env.py 通过 create_async_engine 直接使用环境变量


[post_write_hooks]
# 生成修订文件后不做自动格式化，保持与仓库风格一致（人工评审）

# 日志配置：仅由 env.py 的 fileConfig 消费
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
